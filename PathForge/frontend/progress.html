<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>MyStudentHub</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <a href="index.html">
                <h1>PathForge</h1>
            </a>

            <!-- Navigation to other tabs -->
            <nav>
                <!-- Placeholder for Course Catalog -->
                <a href="mystudenthub.html">MyStudentHub</a>
                <a href="#">Course Catalog</a>
                <a href="transcript.html">Upload Transcript</a>
                <a href="progress.html">View Degree Progress</a>
            </nav>
        </header>

        <!-- Main content area containing the student profile form -->
        <main>
            <div class="main-content">
                <h1>MyStudentHub</h1>
                <h2>Here you can view your degree progression</h2>

                <!-- Form for collecting the student's academic and career information -->
                <form>
                    <h3>Degree Progress</h3>

                    <label for="cs-core-progress">
                        CS Core: 
                        <span id="cs-core-text">0/32 Credits</span>
                    </label>
                    <progress id="cs-core-progress" max="32" value="0" class="progress">40%</progress>

                    <label for="senior-cs-progress">
                        Senior CS: 
                        <span id="senior-cs-text">0/12 Credits</span>
                    </label>
                    <progress id="senior-cs-progress" max="12" value="0" class="progress">40%</progress>

                    <label for="math-progress">
                        Mathematics: 
                        <span id="math-text">0/17 Credits</span>
                    </label>
                    <progress id="math-progress" max="17" value="0" class="progress">40%</progress>

                    <label for="stats-progress">
                        Statistics: 
                        <span id="stats-text">0/3 Credits</span>
                    </label>
                    <progress id="stats-progress" max="3" value="0" class="progress">40%</progress>

                    <label for="cs-related-progress">
                        CS Related: 
                        <span id="cs-related-text">0/6 Credits</span>
                    </label>
                    <progress id="cs-related-progress" max="6" value="0" class="progress">40%</progress>

                    <label for="natural-science-progress">
                        Natural Science: 
                        <span id="natural-science-text">0/12 Credits</span>
                    </label>
                    <progress id="natural-science-progress" max="12" value="0" class="progress">40%</progress>

                    <label for="mason-core-progress">
                        Mason Core: 
                        <span id="mason-core-text">0/24 Credits</span>
                    </label>
                    <progress id="mason-core-progress" max="24" value="0" class="progress">40%</progress>

                    <label for="elective-progress">
                        Electives: 
                        <span id="elective-text">0/8 Credits</span>
                    </label>
                    <progress id="elective-progress" max="8" value="0" class="progress">40%</progress>
                </form>
            </div>
        </main>
        <script src="progress.js"></script>
    </body>
</html>
