<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>MyStudentHub</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <a href="index.html">
                <h1>PathForge</h1>
            </a>

            <!-- Navigation to other tabs -->
            <nav>
                <!-- Placeholder for Course Catalog -->
                <a href="mystudenthub.html">MyStudentHub</a>
                <a href="#">Course Catalog</a>
                <a href="transcript.html">Upload Transcript</a>
                <a href="progress.html">View Degree Progress</a>
            </nav>
        </header>

        <!-- Main content area containing the student profile form -->
        <main>
            <div class="main-content">
                <h1>MyStudentHub</h1>
                <h2>Here you can view your degree progression</h2>

                <!-- Form for collecting the student's academic and career information -->
                <form>
                    <h3>Degree Progress</h3>
                    
                    <!-- Input field for major -->
                    <label for="degree-progress">Current Progression: <span id="progress-text">48/120 Credits</span></label>
                    <progress id="degree-progress" max="100" value="40" class="progress">40%</progress>
                    <label for="degree-progress">CS Core: <span id="progress-text">8/30 Credits</span></label>
                    <progress id="degree-progress" max="100" value="26" class="progress">40%</progress>
                    <label for="degree-progress">Mathematics: <span id="progress-text">12/20 Credits</span></label>
                    <progress id="degree-progress" max="100" value="60" class="progress">40%</progress>
                    <label for="degree-progress">Electives: <span id="progress-text">28/50 Credits</span></label>
                    <progress id="degree-progress" max="100" value="56" class="progress">40%</progress>
                </form>
            </div>
        </main>
    </body>
</html>
